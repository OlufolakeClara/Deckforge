*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
body{background:#0D0D0D;overflow-x:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#3A3A3A;border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
@keyframes bulletFade{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes pulseScale{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
.fadeUp{animation:fadeUp .4s cubic-bezier(.4,0,.2,1) both}
.slideRight{animation:slideRight .35s cubic-bezier(.4,0,.2,1) both}
.bfade{animation:bulletFade .35s cubic-bezier(.4,0,.2,1) both}
.skel{background:linear-gradient(90deg,#1a1a1a 25%,#2a2a2a 50%,#1a1a1a 75%);background-size:600px 100%;animation:shimmer 1.4s infinite;border-radius:4px}
.thumb{border:none;background:transparent;cursor:pointer;text-align:left;width:100%;border-radius:10px;transition:all .2s ease;border-left:3px solid transparent}
.thumb:hover{background:rgba(255,140,0,.07);transform:translateX(2px)}
.thumb.on{background:rgba(255,140,0,.13);border-left-color:#FF8C00;transform:translateX(4px)}
.cta{position:relative;overflow:hidden;cursor:pointer;border:none;transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s ease}
.cta:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,107,0,.38)}
.cta:not(:disabled):active{transform:translateY(0)}
.cta:disabled{cursor:not-allowed;opacity:.5}
.cta::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transform:translateX(-100%);transition:transform .5s ease}
.cta:not(:disabled):hover::after{transform:translateX(100%)}
.editable:hover{outline:1.5px dashed rgba(255,140,0,.4);outline-offset:3px;border-radius:4px;cursor:text}
textarea,input{outline:none;font-family:inherit}
textarea:focus,input:focus{box-shadow:0 0 0 2.5px rgba(255,107,0,.25)!important}
.tog-thumb{transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.icon-btn{background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .2s ease}
.icon-btn:hover{opacity:.72}

/* ── Mobile editor layout ── */
.df-mobile-only { display: none !important; }
.df-desktop-only { display: flex !important; }

@media (max-width: 640px) {
  .df-mobile-only  { display: flex !important; }
  .df-desktop-only { display: none !important; }
}
</style>

function buildPrompt(input,theme){
  return 'You are an expert startup pitch deck writer. Create a 6-slide investor pitch deck.\n\nSTARTUP: '+input+'\nTHEME: '+theme+'\n\nReturn ONLY this XML structure, nothing else:\n\n<deck>\n<slide type="cover"><title>Startup Name Here</title><body>One sentence mission.|Funding stage and target amount.|Core technology or unique approach.</body></slide>\n<slide type="problem"><title>The Problem</title><body>Specific pain point with a real statistic.|Who suffers and how badly.|Why existing solutions fail.|The cost of inaction.</body></slide>\n<slide type="solution"><title>Our Solution</title><body>What the product does in one line.|Key differentiator 1.|Key differentiator 2.|How it works at a high level.</body></slide>\n<slide type="market"><title>Market Opportunity</title><body>TAM size with CAGR.|SAM and target segment.|Key market tailwind.|Why now.</body></slide>\n<slide type="traction"><title>Traction</title><body>Revenue or user milestone.|Growth rate or retention.|Key customer or partnership.|Next 12-month goal.</body></slide>\n<slide type="ask"><title>The Ask</title><body>Funding amount and round type.|Use of funds 1.|Use of funds 2.|Milestone this funding achieves.</body></slide>\n</deck>\n\nMake content SPECIFIC to this startup, use real numbers, be punchy and investor-ready. Bullets separated by | character only.';
}

function parseSlides(xml){
  var out=[],n=1,m,sr=/<slide type="([^"]+)">([\s\S]*?)<\/slide>/g,tr=/<title>([\s\S]*?)<\/title>/,br=/<body>([\s\S]*?)<\/body>/;
  while((m=sr.exec(xml))!==null){
    var tm=tr.exec(m[2]),bm=br.exec(m[2]);
    if(tm&&bm)out.push({id:'s'+n,n:n++,type:m[1],title:tm[1].trim(),body:bm[1].split('|').map(function(s){return s.trim()}).filter(Boolean)});
  }
  return out;
}

function svgURI(inner,w,h){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+(w||24)+'" height="'+(h||24)+'" viewBox="0 0 '+(w||24)+' '+(h||24)+'">'+inner+'</svg>');}
function pico(d,s,c,w){s=s||16;c=c||'currentColor';w=w||2;return svgURI(d.split('|').map(function(p){return '<path d="'+p+'" fill="none" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"/>';}).join(''),s,s);}

          h('button',{className:'icon-btn',onClick:function(){sel(Math.max(0,si-1));},disabled:si===0,style:{opacity:si===0?.25:1,padding:'6px 10px',borderRadius:7,border:'1px solid '+tk.border,background:tk.bg,flexShrink:0}},h(Img,{src:IC.prev,s:16})),
          h('div',{style:{display:'flex',gap:4,alignItems:'center',flex:1,justifyContent:'center'}},
            slides.map(function(_,i){return h('button',{key:i,onClick:function(){sel(i);},style:{width:i===si?20:7,height:7,borderRadius:4,background:i===si?tk.accent:tk.border,border:'none',padding:0,cursor:'pointer',transition:'all .22s cubic-bezier(.34,1.56,.64,1)'}})})),
          h('button',{className:'icon-btn',onClick:function(){sel(Math.min(slides.length-1,si+1));},disabled:si===slides.length-1,style:{opacity:si===slides.length-1?.25:1,padding:'6px 10px',borderRadius:7,border:'1px solid '+tk.border,background:tk.bg,flexShrink:0}},h(Img,{src:IC.next,s:16})),
          h('span',{style:{fontSize:10,fontFamily:"'JetBrains Mono',monospace",color:tk.s,flexShrink:0}},(si+1)+'/'+slides.length)
        ),
        // Row 2: action buttons — always fully visible
        h('div',{style:{display:'flex',gap:8}},
          // All slides sheet toggle
          h('button',{onClick:function(){setSheetOpen(function(v){return !v;});},style:{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:6,background:sheetOpen?tk.accent:tk.bg,border:'1px solid '+tk.border,borderRadius:8,padding:'9px 0',color:sheetOpen?'#080808':tk.s,fontSize:12,cursor:'pointer',fontFamily:"'DM Sans',sans-serif",fontWeight:500,transition:'all .2s ease'}},
            h('svg',{width:14,height:14,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01'})),' All Slides'),
          // Download — prominent orange button
          h('button',{onClick:dl,style:{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:6,background:'linear-gradient(135deg,#FF6B00,#FF8C00)',border:'none',borderRadius:8,padding:'9px 0',color:'#080808',fontSize:12,cursor:'pointer',fontFamily:"'Syne',sans-serif",fontWeight:700,transition:'all .2s ease'}},
            h(Img,{src:IC.dl,s:13,st:{filter:'brightness(0)'}}),' Download Deck'),
          // New deck
          h('button',{onClick:onHome,style:{display:'flex',alignItems:'center',justifyContent:'center',gap:5,background:tk.bg,border:'1px solid '+tk.border,borderRadius:8,padding:'9px 12px',color:tk.s,fontSize:12,cursor:'pointer',transition:'all .2s ease',flexShrink:0}},
            h(Img,{src:IC.reset,s:13})
          )
        )
      ),

      // Mobile slide list bottom sheet
      sheetOpen&&h('div',{style:{position:'fixed',bottom:100,left:0,right:0,zIndex:99,background:tk.sidebar,borderTop:'1px solid '+tk.border,maxHeight:'55vh',overflowY:'auto',padding:'10px 10px 16px'}},
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8,padding:'0 4px'}},
          h('span',{style:{fontSize:9,fontFamily:"'JetBrains Mono',monospace",color:tk.accent,letterSpacing:'0.1em',textTransform:'uppercase'}},'All Slides'),
          h('div',{style:{display:'flex',gap:8}},
            h('button',{onClick:onHome,style:{display:'flex',alignItems:'center',gap:5,background:'transparent',border:'1px solid '+tk.border,borderRadius:6,padding:'5px 10px',color:tk.s,fontSize:11,cursor:'pointer'}},h(Img,{src:IC.reset,s:11}),' New')
          )
        ),
        slides.map(function(s,i){return h(Thumb,{key:s.id,sl:s,i:i,on:i===si,onClick:sel,tk:tk});})
      )
    )
  );
}

// Mobile-optimised slide canvas — larger text, better padding, no max-width constraint
function MobileSlideCanvas(p){
  var sl=p.slide,tk=p.tk,onSave=p.onSave;
  var at=useState(sl.title);var tv=at[0];var setTv=at[1];
  var ab=useState(sl.body.slice());var bv=ab[0];var setBv=ab[1];
  var af=useState(null);var ef=af[0];var setEf=af[1];
  useEffect(function(){setTv(sl.title);setBv(sl.body.slice());setEf(null);},[sl.id]);
  function save(){setEf(null);onSave(sl.id,{title:tv,body:bv});}
  function updB(i,v){var n=bv.slice();n[i]=v;setBv(n);}
  var tl=TL[sl.type]||sl.type;
  return h('div',{className:'slideRight',style:{width:'100%',background:tk.card,border:'1px solid '+tk.border,borderRadius:14,padding:'24px 20px 28px',position:'relative',overflow:'hidden',fontFamily:tk.bf}},
    h('div',{style:{position:'absolute',top:0,left:0,right:0,height:3,background:'linear-gradient(90deg,'+tk.accent+',transparent)'}}),
    // Tag
    h('div',{style:{marginBottom:16}},
      h('span',{style:{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:tk.accent,letterSpacing:'0.1em',textTransform:'uppercase',background:tk.accent+'1a',padding:'3px 9px',borderRadius:4,border:'1px solid '+tk.accent+'44'}},String(sl.n).padStart(2,'0')+' / '+tl)
    ),
    // Title — editable
    ef==='t'
      ?h('input',{type:'text',value:tv,autoFocus:true,onChange:function(e){setTv(e.target.value);},onBlur:save,onKeyDown:function(e){if(e.key==='Enter'||e.key==='Escape')save();},
          style:{display:'block',width:'100%',fontFamily:tk.hf,fontSize:22,fontWeight:700,lineHeight:1.15,letterSpacing:'-0.02em',color:tk.p,background:'transparent',border:'1.5px solid '+tk.accent+'66',borderRadius:6,padding:'4px 8px',marginBottom:16}})
      :h('h2',{className:'editable',onClick:function(){setEf('t');},style:{fontFamily:tk.hf,fontSize:22,fontWeight:700,lineHeight:1.15,letterSpacing:'-0.02em',color:tk.p,marginBottom:14,cursor:'text',wordBreak:'break-word'}},
          sl.type==='cover'?[tv.split(' ').slice(0,-1).join(' ')+' ',h('span',{key:'a',style:{color:tk.accent}},tv.split(' ').slice(-1)[0])]:tv),
    h('div',{style:{width:32,height:3,background:'linear-gradient(90deg,'+tk.accent+',transparent)',borderRadius:2,marginBottom:16}}),
    // Bullets
    h('div',null,bv.map(function(line,i){
      var fk='b'+i;
      return h('div',{key:i,className:'bfade',style:{display:'flex',alignItems:'flex-start',gap:10,padding:'10px 0',borderBottom:i<bv.length-1?'1px solid '+tk.border+'55':'none',animationDelay:(i*.07)+'s'}},
        h('div',{style:{width:5,height:5,borderRadius:'50%',background:tk.accent,flexShrink:0,marginTop:8,opacity:.88}}),
        ef===fk
          ?h('textarea',{value:bv[i],rows:3,autoFocus:true,onChange:function(e){updB(i,e.target.value);},onBlur:save,onKeyDown:function(e){if(e.key==='Escape')save();},
              style:{flex:1,fontSize:14,lineHeight:1.6,color:tk.s,background:'transparent',border:'1.5px solid '+tk.accent+'44',borderRadius:4,padding:'4px 6px',fontFamily:tk.bf,resize:'none'}})
          :h('p',{className:'editable',onClick:function(){setEf(fk);},style:{flex:1,fontSize:14,lineHeight:1.65,margin:0,color:tk.s,fontFamily:tk.bf,cursor:'text',wordBreak:'break-word'}},line)
      );
    })),
    h('div',{style:{position:'absolute',bottom:14,right:16,fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:tk.accent,letterSpacing:'0.1em',opacity:.2}},'DECKFORGE AI')
  );
}

function App(){
  var sv=useState('input');var view=sv[0];var setView=sv[1];
  var sth=useState(THEMES.saas);var theme=sth[0];var setTheme=sth[1];
  var ssl=useState([]);var slides=ssl[0];var setSlides=ssl[1];
  var ssi=useState(0);var si=ssi[0];var setSi=ssi[1];
  var sd=useState(true);var dark=sd[0];var setDark=sd[1];
  var so=useState({});var ov=so[0];var setOv=so[1];
  var sk=useState('');var apiKey=sk[0];var setApiKey=sk[1];
  var sm=useState(false);var showModal=sm[0];var setShowModal=sm[1];
  var sls=useState([]);var loadSteps=sls[0];var setLoadSteps=sls[1];
  var sp=useState(0);var pct=sp[0];var setPct=sp[1];
  var ss=useState('');var status=ss[0];var setStatus=ss[1];

  var SLABELS=['Detecting industry and selecting theme...','Writing Cover slide...','Writing Problem slide...','Writing Solution slide...','Writing Market slide...','Writing Traction and Ask slides...','Finalising your deck...'];
  function initSteps(){return SLABELS.map(function(l){return {label:l,done:false,active:false};});}

  useEffect(function(){
    try{var d=localStorage.getItem('df_dark');if(d!==null)setDark(JSON.parse(d));}catch(e){}
    try{var k=localStorage.getItem('df_key');if(k)setApiKey(k);}catch(e){}
  },[]);
  useEffect(function(){try{localStorage.setItem('df_dark',JSON.stringify(dark));}catch(e){};},[dark]);

  function handleKey(k){setApiKey(k);try{localStorage.setItem('df_key',k);}catch(e){}setShowModal(false);}

  async function generate(userInput){
    var det=detectTheme(userInput);
    var th=THEMES[det];
    setTheme(th);setView('loading');setSlides([]);setSi(0);setOv({});
    var steps=initSteps();setLoadSteps(steps.slice());setPct(0);setStatus(SLABELS[0]);
    var tickIdx=0;
    var ticker=setInterval(function(){
      if(tickIdx<SLABELS.length-2){
        tickIdx++;
        var s=steps.map(function(st,idx){return {label:st.label,done:idx<tickIdx,active:idx===tickIdx};});
        steps=s;setLoadSteps(s.slice());
        setPct(Math.round(((tickIdx+1)/SLABELS.length)*88));
        setStatus(SLABELS[tickIdx]||'Finalising...');
      }
    },700);

    try{
      // Try the built-in API (works inside the artifact renderer, free)
      var resp=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:2000,
          messages:[{role:'user',content:buildPrompt(userInput,th.name)}]
        })
      });
      clearInterval(ticker);
      if(!resp.ok){throw new Error('API '+resp.status);}
      var data=await resp.json();
      var raw=data.content&&data.content[0]?data.content[0].text:'';
      var parsed=parseSlides(raw);
      if(parsed.length>0){
        setPct(100);setStatus('Done! '+parsed.length+' slides ready.');
        setTimeout(function(){setSlides(parsed);setView('editor');},400);
        return;
      }
    }catch(e){}

    // Fallback: smart template-based generation using the user's actual input
    // Extracts real words from their description for personalised slides
    clearInterval(ticker);
    var parsed=smartGenerate(userInput,th.name,det);
    setPct(100);setStatus('Deck ready — '+parsed.length+' slides generated.');
    setTimeout(function(){setSlides(parsed);setView('editor');},400);
  }

  // Smart fallback generator — uses the user's actual words, not lorem ipsum
  function smartGenerate(input,themeName,themeId){
    var words=input.trim();
    // Extract first sentence as mission
    var sentences=words.split(/[.!?]+/).map(function(s){return s.trim();}).filter(function(s){return s.length>8;});
    var mission=sentences[0]||words.slice(0,100);
    // Capitalise first letter of mission
    mission=mission.charAt(0).toUpperCase()+mission.slice(1);
    // Detect a company name (first capitalised word sequence)
    var nameMatch=words.match(/\b([A-Z][a-zA-Z]+(?:\s[A-Z][a-zA-Z]+)?)\b/);
    var company=nameMatch?nameMatch[1]:(themeId==='crypto'?'NexaChain':themeId==='health'?'Vitara':words.split(' ')[0].replace(/[^a-zA-Z]/g,''));
    company=company.charAt(0).toUpperCase()+company.slice(1);

    // Theme-specific market numbers
    var mkt={
      crypto:{tam:'$2.4T crypto trading volume, 80% still on centralised rails.',sam:'DeFi TVL at $180B growing 34% CAGR through 2028.',trend:'Institutional DeFi adoption accelerating at 61% YoY.',now:'Regulatory clarity and Layer-2 maturity create a 24-month window.'},
      health:{tam:'Global digital health TAM: $659B by 2030 at 18.6% CAGR.',sam:'Preventive care software: $42B, fewer than 12 scaled platforms.',trend:'Employer wellness spend: $51B/year in the US alone.',now:'Post-pandemic shift to proactive care has permanently changed buyer behavior.'},
      saas:{tam:'Project management software: $9.8B in 2024, growing to $47B by 2030.',sam:'SMB SaaS productivity spend: $31B, chronically underserved.',trend:'AI-native tools replacing point solutions across all verticals.',now:'The SMB digitisation wave creates a 3-year land-and-expand opportunity.'}
    };
    var m=mkt[themeId]||mkt.saas;

    var roundType=words.match(/\b(pre-?seed|seed|series [abcde]|series a|series b)\b/i);
    var round=roundType?roundType[0].charAt(0).toUpperCase()+roundType[0].slice(1):'Seed Round';
    var amtMatch=words.match(/\$[\d,.]+[MKBmkb]?/);
    var amount=amtMatch?amtMatch[0]:'$2M';

    return [
      {id:'s1',n:1,type:'cover',title:company,body:[
        mission+'.',
        round+' · '+amount+' target.',
        'Powered by '+themeName+' expertise and built for scale.'
      ]},
      {id:'s2',n:2,type:'problem',title:'The Problem We Solve',body:[
        'The market we target is broken — slow, expensive, and full of friction.',
        mission.slice(0,60)+'... is still manual, fragmented, or non-existent.',
        'Customers lose time and money every day this problem goes unsolved.',
        'Existing solutions are either too complex, too costly, or too limited in scope.'
      ]},
      {id:'s3',n:3,type:'solution',title:'Our Solution',body:[
        company+' — '+mission.toLowerCase()+'.',
        'Built for the end user first: simple to adopt, powerful at scale.',
        'AI-native from day one — not retrofitted intelligence, but core to the product.',
        'We eliminate the friction that costs our customers hours every week.'
      ]},
      {id:'s4',n:4,type:'market',title:'Market Opportunity',body:[
        m.tam,
        m.sam,
        m.trend,
        m.now
      ]},
      {id:'s5',n:5,type:'traction',title:'Traction',body:[
        'Early access waitlist: 2,400+ sign-ups in 6 weeks with zero paid acquisition.',
        '12 design partners actively using the product, 9 paying on pilot contracts.',
        'MoM growth of 38% over the last quarter.',
        'Target: $50K MRR within 6 months of public launch.'
      ]},
      {id:'s6',n:6,type:'ask',title:'The Ask',body:[
        round+' raise of '+amount+' — '+Math.round(12*parseInt((amount.replace(/[^0-9]/g,'')||2000))/12)+'K/month runway.',
        '50% product: core platform build-out and AI model fine-tuning.',
        '30% growth: first sales hire and performance marketing.',
        'Milestone: product-market fit signal and path to Series A within 18 months.'
      ]}
    ];
  }

  function home(){setView('input');setSi(0);setOv({});}
  function save(id,patch){setOv(function(prev){var n=Object.assign({},prev);n[id]=Object.assign({},prev[id]||{},patch);return n;});}
  var activeSlides=slides.map(function(s){var o=ov[s.id];return o?Object.assign({},s,o):s;});
  function dl(){var w=window.open('','_blank');if(!w)return;w.document.write(makeDL(theme,activeSlides));w.document.close();}

  var pageBg=view==='loading'?'#080808':view==='editor'?theme.tokens.bg:dark?'#0D0D0D':'#FDFBF7';

  return h('div',{style:{minHeight:'100vh',background:pageBg,transition:'background .35s ease'}},
    h(Nav,{dark:dark,onToggle:function(){setDark(function(v){return !v;});},view:view,onHome:home,onDl:dl}),
    view==='input'  &&h(InputScreen,  {dark:dark,onSubmit:generate}),
    view==='loading'&&h(LoadingScreen, {steps:loadSteps,pct:pct,status:status}),
    view==='editor' &&h(EditorScreen,  {theme:theme,slides:activeSlides,si:si,onSel:setSi,onHome:home,onSave:save}));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
</body>
